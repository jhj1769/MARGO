[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "margo"
version = "0.1.0"
description = "MARGO — A Multi-Agent Framework for Stakeholder-Aware Recommendation Governance"
authors = [{ name = "Hyunjun Jung", email = "jung@postech.ac.kr" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "research-only" }

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["api"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "notebooks"]
